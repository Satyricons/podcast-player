<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ Podcast Index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- НАВИГАЦИЯ С АУДИОПЛЕЕРОМ -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <div class="d-flex align-items-center w-100 flex-wrap">
                <!-- Логотип -->
                <span class="navbar-brand me-3">
                    <i class="fas fa-podcast"></i> Podcast Index
                </span>
                
                <!-- Статус -->
                <span class="navbar-text text-white me-3" id="status">
                    <span class="status-dot bg-warning"></span>
                    <span class="status-text">Загрузка...</span>
                </span>

                <!-- АУДИОПЛЕЕР (в шапке) -->
                <div class="audio-player-container ms-auto" id="headerPlayer" style="display: none;">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <button class="btn btn-sm btn-outline-light" id="playPauseBtn" onclick="app.togglePlay()">
                            <i class="fas fa-play"></i>
                        </button>
                        <span class="text-white small" id="currentTrackTitle">Нет трека</span>
                        <input type="range" class="form-range" id="progressBar" 
                               min="0" max="100" value="0" style="width: 150px;">
                        <span class="text-white small" id="timeDisplay">0:00 / 0:00</span>
                        <button class="btn btn-sm btn-outline-light" onclick="app.stopAudio()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>

                <!-- Кнопка переключения темы (опционально) -->
                <button class="btn btn-sm btn-outline-light ms-2" onclick="app.toggleTheme()">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- СКРЫТЫЙ АУДИОЭЛЕМЕНТ -->
    <audio id="globalAudioPlayer" style="display: none;"></audio>

    <!-- Основной контент -->
    <div class="container mt-4">
        <div class="row">
            <!-- Левая колонка -->
            <div class="col-md-8">
                <!-- Поиск -->
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-md-8">
                                <input type="text" class="form-control" id="searchInput" placeholder="Поиск подкастов..." value="technology">
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-primary w-100" id="searchBtn">
                                    <i class="fas fa-search"></i> Найти
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Результаты -->
                <div id="results">
                    <div class="text-center py-5" id="loading" style="display:none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                        <p class="mt-2">Поиск подкастов...</p>
                    </div>
                    <div class="row" id="resultsList"></div>
                </div>
            </div>

            <!-- Правая колонка -->
            <div class="col-md-4">
                <!-- Детали -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5><i class="fas fa-info-circle"></i> Детали</h5>
                        <div id="details">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-hand-pointer fa-3x"></i>
                                <p class="mt-2">Нажмите на подкаст</p>
                                <small class="d-block">🔐 Аутентификация: SHA-1</small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Статистика -->
                <div class="card mt-3">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-6 text-center">
                                <h3 id="totalResults">0</h3>
                                <small class="text-muted">Найдено</small>
                            </div>
                            <div class="col-6 text-center">
                                <span class="badge bg-success p-2">
                                    <i class="fas fa-shield-alt"></i> SHA-1
                                </span>
                                <small class="d-block text-muted mt-1">Аутентификация</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Наши скрипты -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
