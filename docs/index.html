<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎙️ Podcast Index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- НАВИГАЦИЯ С АУДИОПЛЕЕРОМ -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <div class="d-flex align-items-center w-100 flex-wrap">
                <span class="navbar-brand me-3">
                    <i class="fas fa-podcast"></i> Podcast Index
                </span>
                <span class="navbar-text text-white me-3" id="status">
                    <span class="status-dot bg-warning"></span>
                    <span class="status-text">Загрузка...</span>
                </span>
                
                <!-- АУДИОПЛЕЕР В ШАПКЕ -->
                <div class="audio-player-container ms-auto" id="headerPlayer" style="display: none;">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <!-- Кнопка Play/Pause -->
                        <button class="btn btn-sm btn-outline-light" id="playPauseBtn" onclick="app.togglePlay()" disabled>
                            <i class="fas fa-play"></i>
                        </button>
                        
                        <!-- Название трека -->
                        <span class="text-white small" id="currentTrackTitle">Нет трека</span>
                        
                        <!-- Прогресс-бар -->
                        <input type="range" class="form-range" id="progressBar" min="0" max="100" value="0" style="width: 150px;" />
                        
                        <!-- Время -->
                        <span class="text-white small" id="timeDisplay">0:00 / 0:00</span>
                        
                        <!-- Скорость воспроизведения -->
                        <div class="btn-group btn-group-sm" id="speedGroup">
                            <button class="btn btn-outline-light speed-btn active" data-speed="1" onclick="app.setPlaybackRate(1)">1x</button>
                            <button class="btn btn-outline-light speed-btn" data-speed="1.5" onclick="app.setPlaybackRate(1.5)">1.5x</button>
                            <button class="btn btn-outline-light speed-btn" data-speed="2" onclick="app.setPlaybackRate(2)">2x</button>
                        </div>
                        
                        <!-- Громкость -->
                        <div class="d-flex align-items-center gap-1">
                            <i class="fas fa-volume-up text-white small" id="volumeIcon"></i>
                            <input type="range" class="form-range" id="volumeControl" min="0" max="100" value="80" style="width: 60px;" />
                        </div>
                        
                        <!-- Кнопка закрытия -->
                        <button class="btn btn-sm btn-outline-light" onclick="app.stopAudio()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Переключение темы -->
                <button class="btn btn-sm btn-outline-light ms-2" onclick="app.toggleTheme()">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="container mt-4">
        <div class="row">
            <!-- Левая колонка -->
            <div class="col-md-8">
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="searchInput" placeholder="Поиск подкастов..." value="technology" />
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-primary w-100" id="searchBtn">
                                    <i class="fas fa-search"></i> Найти
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-outline-secondary w-100" id="playlistToggle" onclick="app.togglePlaylist()">
                                    <i class="fas fa-list"></i> Плейлист
                                    <span class="badge bg-danger ms-1" id="playlistCount">0</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="results">
                    <div class="text-center py-5" id="loading" style="display: none;">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2">Поиск подкастов...</p>
                    </div>
                    <div class="row" id="resultsList"></div>
                </div>
            </div>

            <!-- Правая колонка -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5><i class="fas fa-info-circle"></i> Детали</h5>
                        <div id="details">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-hand-pointer fa-3x"></i>
                                <p class="mt-2">Нажмите на подкаст</p>
                                <small class="d-block">🔐 Аутентификация: SHA-1</small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-6 text-center">
                                <h3 id="totalResults">0 / 0</h3>
                                <small class="text-muted">Загружено / Всего</small>
                            </div>
                            <div class="col-6 text-center">
                                <span class="badge bg-success p-2">
                                    <i class="fas fa-shield-alt"></i> SHA-1
                                </span>
                                <small class="d-block text-muted mt-1">Аутентификация</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Избранное -->
                <div class="card mt-3">
                    <div class="card-body">
                        <h6><i class="fas fa-star text-warning"></i> Избранное</h6>
                        <div id="favoritesList">
                            <small class="text-muted">Нет избранных подкастов</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно плейлиста -->
    <div class="modal fade" id="playlistModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-list"></i> Плейлист</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="playlistModalBody">
                    <p class="text-muted">Плейлист пуст</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-danger btn-sm" onclick="app.clearPlaylist()">
                        <i class="fas fa-trash"></i> Очистить плейлист
                    </button>
                    <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="globalAudioPlayer" style="display: none;"></audio>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
